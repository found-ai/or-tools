# Builds the cp312 wheels of this branch and attaches them to a release.
# Run it by hand (workflow_dispatch) with the release tag to create or update.
name: Found wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to attach the wheels to
        required: true
        default: v9.15.6755-found.1

permissions:
  contents: write

env:
  OR_TOOLS_PATCH: "6755"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x86_64
          - runner: ubuntu-24.04-arm
            platform: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build the wheel in the manylinux image
        run: |
          docker run --rm -v "$PWD":/project -w /project \
            -e PLATFORM=${{ matrix.platform }} -e OR_TOOLS_PATCH \
            quay.io/pypa/manylinux_2_28_${{ matrix.platform }} \
            bash tools/found/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install -U pip setuptools wheel virtualenv absl-py mypy mypy-protobuf \
            numpy pandas typing-extensions immutabledict "swig==4.3.1" ninja
          cmake -S. -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DEPS=ON -DBUILD_PYTHON=ON \
            -DBUILD_TESTING=OFF -DBUILD_SAMPLES=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build --target python_package
          mkdir -p wheelhouse && cp build/python/dist/*.whl wheelhouse/
      - name: Smoke test
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install wheelhouse/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/tools/found/smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          cd dist
          sha256sum *.whl | tee SHA256SUMS
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "OR-Tools v9.15 with one fix in ortools/sat/pb_constraint.cc (the at-most-one reason shortcut is skipped for enforced pb constraints). cp312 wheels for manylinux_2_28 x86_64 and aarch64, and macOS arm64. Built from $GITHUB_SHA."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *.whl SHA256SUMS
